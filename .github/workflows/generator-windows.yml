name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'version to buld'
        required: true
        default: 'master'
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: 'none'
        type: string
      app_version:
        description: 'custom app version string (overrides build version)'
        required: false
        default: ''
        type: string

env:
  appname: "TC RDP"
  filename: "TC-RDP"
  iconlink_url: "false"
  logolink_url: "false"
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "nightly"
  VCPKG_BINARY_SOURCES: "clear"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"
  UPLOAD_ARTIFACT: 'true'

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      rustdesk-version: ${{ inputs.version }}
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Preserve custom logo
        shell: bash
        run: cp custom-logo.png "$RUNNER_TEMP/custom-logo.png"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v7
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v7
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Inject Custom Server Config
        shell: bash
        run: |
          sed -i 's#://rustdesk.com#172.16.100.202#g' libs/hbb_common/src/config.rs
          sed -i 's#OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=#ruAid6RIyuEI+Pr1ewM50ySKPhPWSbHuOYE6Hv1YEnY=#g' libs/hbb_common/src/config.rs
          sed -i 's#PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("".to_owned())#PROD_RENDEZVOUS_SERVER: RwLock<String> = RwLock::new("172.16.100.202".to_owned())#g' libs/hbb_common/src/config.rs

      - name: Apply custom app name (TC RDP)
        shell: python
        run: |
          import os
          app = "TC RDP"
          for path in ["res/msi/Bundle.wxs", "res/msi/Package.wxs", "flutter/windows/runner/Runner.rc"]:
              if os.path.isfile(path):
                  with open(path, "r", encoding="utf-8") as f:
                      t = f.read()
                  t = t.replace("RustDesk", app)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(t)
          rs = "libs/hbb_common/src/config.rs"
          if os.path.isfile(rs):
              with open(rs, "r", encoding="utf-8") as f:
                  t = f.read()
              t = t.replace('pub const APP_NAME: &str = "RustDesk";', f'pub const APP_NAME: &str = "{app}";')
              with open(rs, "w", encoding="utf-8") as f:
                  f.write(t)
          win_rs = "src/platform/windows.rs"
          if os.path.isfile(win_rs):
              with open(win_rs, "r", encoding="utf-8") as f:
                  t = f.read()
              t = t.replace('RustDesk.lnk', f'{app}.lnk')
              with open(win_rs, "w", encoding="utf-8") as f:
                  f.write(t)

      - name: Generate custom icons from custom-logo.png
        shell: pwsh
        run: |
          $logo = "$env:RUNNER_TEMP\custom-logo.png"
          magick $logo -resize 256x256 -define icon:auto-resize=256,128,64,48,32,16 res/icon.ico
          magick $logo -resize 256x256 -define icon:auto-resize=256,128,64,48,32,16 flutter/windows/runner/resources/app_icon.ico
          magick $logo -resize 32x32 res/tray-icon.ico
          magick $logo -resize 32x32 flutter/windows/runner/resources/tray_icon.ico
          magick $logo -resize 256x256 res/icon.png
          magick $logo -resize 256x256 flutter/assets/icon.png
          if (Test-Path "flutter/assets/logo.png") { magick $logo -resize 256x256 flutter/assets/logo.png }

      - name: Set custom app version 
        continue-on-error: true
        if: ${{ inputs.app_version != '' }}
        shell: bash
        run: |
          sed -i -e 's|^version = ".*"|version = "${{ inputs.app_version }}"|' ./Cargo.toml
          sed -i '/name = "rustdesk"/ {n; s/version = ".*"/version = "${{ inputs.app_version }}"/}' ./Cargo.lock
          grep '^version = ' ./Cargo.toml

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      - name: allow custom.txt
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            $base = "https://" + "raw." + "githubusercontent.com" + "/bryangerlach/rdgen/refs/heads/master/.github/patches"
            Invoke-WebRequest -Uri "$base/allowCustom.py" -OutFile allowCustom.py
            python allowCustom.py
            Invoke-WebRequest -Uri "$base/forcePresetPassword.py" -OutFile forcePresetPassword.py
            python forcePresetPassword.py
            Invoke-WebRequest -Uri "$base/removeSetupServerTip.diff" -OutFile removeSetupServerTip.diff
            git apply removeSetupServerTip.diff

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          $engineUrl = "https://" + "github.com" + "/rustdesk/engine/releases/download/main/windows-x64-release.zip"
          Invoke-WebRequest -Uri $engineUrl -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/
          
      - name: Patch flutter
        continue-on-error: true
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore vcpkg installed cache
        uses: actions/cache@v6
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}
          restore-keys: |
            vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Save vcpkg installed cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.vcpkg-triplet }}

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          $usbUrl = "https://" + "github.com" + "/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip"
          Invoke-WebRequest -Uri $usbUrl -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" != "" ]; then
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/rustdesk.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${{ env.filename }}.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          $msiVersion = ''
          if ($env:APP_VERSION -match '^(\d+)\.(\d+)\.(\d+)') {
            $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          }
          pushd ./res/msi
          if ($msiVersion) {
            python preprocess.py --app-name "${{ env.appname }}" --arp -d ../../rustdesk --version "$msiVersion"
          } else {
            python preprocess.py --app-name "${{ env.appname }}" --arp -d ../../rustdesk
          }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi "../../SignOutput/${{ env.filename }}.msi"

      - name: Upload Custom Windows Client
        uses: actions/upload-artifact@v7
        with:
          name: TC-RDP-windows-x64
          path: ./SignOutput/*
